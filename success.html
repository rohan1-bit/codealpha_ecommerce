<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — ShopHaus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>
<div id="cart-mount"></div>
<div id="modal-mount"></div>
<div id="toast-mount"></div>

<div id="success-content">
  <div class="loading" style="min-height:70vh"><div class="spinner"></div></div>
</div>

<footer class="footer">
  <strong>ShopHaus</strong> &mdash; Curated goods for modern living. &copy; 2025
</footer>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
  injectLayout('');

  async function loadOrder() {
    const orderId = getParam('orderId');
    if (!orderId || !user) { navigate('index.html'); return; }

    try {
      const order = await apiFetch(`/orders/${orderId}`);
      const addr = typeof order.shipping_address === 'string' ? JSON.parse(order.shipping_address) : order.shipping_address;

      document.getElementById('success-content').innerHTML = `
        <div class="success-page" style="padding-top:5rem">
          <div class="success-icon">
            <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <h1>Order Confirmed!</h1>
          <p style="font-weight:600;color:var(--dark)">Thank you, ${user.name.split(' ')[0]}!</p>
          <p>Your order has been placed and is being processed. We'll send you a confirmation email shortly.</p>

          <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;margin:2rem 0;text-align:left">
            <div style="display:flex;justify-content:space-between;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)">
              <div>
                <div style="font-size:12px;color:var(--mid);margin-bottom:0.2rem;letter-spacing:0.06em;text-transform:uppercase">Order ID</div>
                <div style="font-size:13px;font-weight:600;font-family:monospace">#${order.id.substring(0,8).toUpperCase()}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:12px;color:var(--mid);margin-bottom:0.2rem;letter-spacing:0.06em;text-transform:uppercase">Status</div>
                <div class="order-status">✓ ${order.status}</div>
              </div>
            </div>

            <div style="margin-bottom:1rem">
              <div style="font-size:12px;color:var(--mid);margin-bottom:0.5rem;letter-spacing:0.06em;text-transform:uppercase">Items Ordered</div>
              ${order.items.map(item => `
                <div style="display:flex;align-items:center;gap:0.8rem;padding:0.5rem 0;border-bottom:1px solid var(--border)">
                  <img src="${item.image}" style="width:44px;height:44px;border-radius:4px;object-fit:cover" onerror="this.src='https://via.placeholder.com/44'">
                  <div style="flex:1;font-size:14px">${item.name}</div>
                  <div style="font-size:13px;color:var(--mid)">×${item.quantity}</div>
                  <div style="font-size:14px;font-weight:600">$${(item.price * item.quantity).toFixed(2)}</div>
                </div>
              `).join('')}
            </div>

            <div style="display:flex;justify-content:space-between;font-weight:700;padding-top:0.5rem">
              <span>Total</span>
              <span>$${parseFloat(order.total).toFixed(2)}</span>
            </div>

            ${addr ? `
              <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)">
                <div style="font-size:12px;color:var(--mid);margin-bottom:0.3rem;letter-spacing:0.06em;text-transform:uppercase">Ship To</div>
                <div style="font-size:14px;color:var(--mid)">${addr.street}, ${addr.city}, ${addr.state} ${addr.zip}</div>
              </div>` : ''}
          </div>

          <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
            <a href="orders.html" class="btn btn-outline">View All Orders</a>
            <a href="index.html" class="btn btn-primary">Continue Shopping</a>
          </div>
        </div>`;
    } catch {
      navigate('index.html');
    }
  }

  document.addEventListener('DOMContentLoaded', loadOrder);
</script>
</body>
</html>
