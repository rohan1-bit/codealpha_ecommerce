<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — ShopHaus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>
<div id="cart-mount"></div>
<div id="modal-mount"></div>
<div id="toast-mount"></div>

<div class="page-header">
  <h1>My Orders</h1>
  <div class="breadcrumb">
    <a href="index.html">Shop</a> › <span>Orders</span>
  </div>
</div>

<div class="section" style="max-width:860px">
  <div id="orders-container">
    <div class="loading" style="min-height:40vh"><div class="spinner"></div></div>
  </div>
</div>

<footer class="footer">
  <strong>ShopHaus</strong> &mdash; Curated goods for modern living. &copy; 2025
</footer>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
  injectLayout('orders');

  async function loadOrders() {
    if (!user) {
      document.getElementById('orders-container').innerHTML = `
        <div class="empty-state">
          <h3>Sign in to view orders</h3>
          <p>You need to be logged in to see your order history.</p>
          <button class="btn btn-primary" style="margin-top:1.5rem" onclick="openAuthModal('login')">Sign In</button>
        </div>`;
      return;
    }

    try {
      const orders = await apiFetch('/orders');

      if (!orders.length) {
        document.getElementById('orders-container').innerHTML = `
          <div class="empty-state">
            <h3>No orders yet</h3>
            <p>You haven't placed any orders. Start shopping!</p>
            <a href="index.html" class="btn btn-primary" style="margin-top:1.5rem">Browse Products</a>
          </div>`;
        return;
      }

      document.getElementById('orders-container').innerHTML = `
        <div class="orders-list">
          ${orders.map(order => {
            const addr = typeof order.shipping_address === 'string' ? JSON.parse(order.shipping_address) : order.shipping_address;
            const date = new Date(order.created_at).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
            return `
            <div class="order-card">
              <div class="order-card-header">
                <div>
                  <div style="font-weight:600;margin-bottom:0.2rem">Order #${order.id.substring(0,8).toUpperCase()}</div>
                  <div class="order-date">${date}</div>
                </div>
                <div style="display:flex;align-items:center;gap:1rem">
                  <span class="order-status">✓ ${order.status}</span>
                  <span style="font-weight:700;font-size:1.05rem">$${parseFloat(order.total).toFixed(2)}</span>
                </div>
              </div>

              <div class="order-items-preview">
                ${order.items.map(item => `
                  <img class="order-thumb" src="${item.image}" alt="${item.name}" title="${item.name} ×${item.quantity}" onerror="this.src='https://via.placeholder.com/52'">
                `).join('')}
              </div>

              <div style="font-size:13px;color:var(--mid);padding-top:0.8rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
                <span>
                  ${order.items.length} item${order.items.length !== 1 ? 's' : ''}
                  ${addr ? `· Ships to ${addr.city}, ${addr.state}` : ''}
                </span>
                <div style="display:flex;gap:0.8rem">
                  ${order.items.map(item => `
                    <a href="product.html?id=${item.product_id}" class="btn btn-sm btn-outline">View Items</a>
                  `).slice(0,1).join('')}
                  <a href="index.html" class="btn btn-sm btn-primary">Buy Again</a>
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
    } catch (err) {
      document.getElementById('orders-container').innerHTML = `
        <div class="empty-state">
          <h3>Failed to load orders</h3>
          <p>${err.message}</p>
        </div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadOrders);
</script>
</body>
</html>
