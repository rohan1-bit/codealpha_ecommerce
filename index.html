<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopHaus — Curated Goods</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>
<div id="cart-mount"></div>
<div id="modal-mount"></div>
<div id="toast-mount"></div>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-tag">New Arrivals · Spring 2025</div>
    <h1>Goods Worth <em>Keeping</em></h1>
    <p>Carefully curated objects for modern living — built to last, designed to delight.</p>
    <button class="btn btn-accent btn-lg" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
      Shop Now
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </button>
  </div>
</section>

<!-- SHOP -->
<section class="section" id="shop">
  <div class="section-header">
    <h2 class="section-title">All Products</h2>
    <span id="product-count" style="color:var(--mid);font-size:14px"></span>
  </div>

  <div class="filter-bar">
    <div id="category-filters"></div>
    <select class="sort-select" id="sort-select" onchange="loadProducts()">
      <option value="">Sort: Latest</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
    </select>
  </div>

  <div id="products-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</section>

<footer class="footer">
  <strong>ShopHaus</strong> &mdash; Curated goods for modern living. &copy; 2025
</footer>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
  injectLayout('home');

  let activeCategory = 'All';
  let searchQuery = '';

  function doSearch(val) {
    searchQuery = val;
    loadProducts();
  }

  async function loadCategories() {
    try {
      const cats = await apiFetch('/products/categories');
      const container = document.getElementById('category-filters');
      container.innerHTML = cats.map(cat => `
        <button class="filter-btn ${cat === 'All' ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</button>
      `).join('');
    } catch {}
  }

  function filterCategory(cat) {
    activeCategory = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === cat));
    loadProducts();
  }

  async function loadProducts() {
    const container = document.getElementById('products-container');
    container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    const sort = document.getElementById('sort-select').value;
    const params = new URLSearchParams();
    if (activeCategory !== 'All') params.set('category', activeCategory);
    if (searchQuery) params.set('search', searchQuery);
    if (sort) params.set('sort', sort);

    try {
      const products = await apiFetch(`/products?${params}`);
      document.getElementById('product-count').textContent = `${products.length} product${products.length !== 1 ? 's' : ''}`;

      if (!products.length) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No products found</h3>
            <p>Try adjusting your filters or search query.</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="products-grid">
          ${products.map(p => `
            <div class="product-card" onclick="navigate('product.html', {id:'${p.id}'})">
              <div class="product-card-img-wrap">
                <img class="product-card-img" src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x240'">
              </div>
              <div class="product-card-body">
                <div class="product-category">${p.category}</div>
                <div class="product-name">${p.name}</div>
                <div class="product-desc">${p.description}</div>
                <div class="product-footer">
                  <span class="product-price">$${parseFloat(p.price).toFixed(2)}</span>
                  <button class="add-to-cart-btn" onclick="event.stopPropagation(); addToCartFromCard(${JSON.stringify(p).replace(/"/g, '&quot;')})" aria-label="Add to cart">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>`;
    } catch (err) {
      container.innerHTML = `<div class="empty-state"><h3>Failed to load products</h3><p>${err.message}</p></div>`;
    }
  }

  function addToCartFromCard(product) {
    addToCart(product, 1);
    openCart();
  }

  // Pre-fill nav search
  document.addEventListener('DOMContentLoaded', () => {
    const q = getParam('search');
    if (q) {
      searchQuery = q;
      const input = document.getElementById('nav-search');
      if (input) input.value = q;
    }
    loadCategories();
    loadProducts();
  });
</script>
</body>
</html>
